<!doctype html>
<html lang="es">
  <head>
    <title>iaempresa</title>
    <meta charset="utf-8">
    <style>
      html,body{width:100%;height:100%;padding:0px;margin:0px;background:floralwhite;}
      body{display:flex;}
      nav{flex:1;border-right:1px solid lightgray;}
      main{flex:5;padding:20px;box-sizing:border-box;}
      main input{position:fixed;width:400px;bottom:20px;right:20px;outline:none;border:1px solid lightgray;padding:10px;border-radius:30px;}
      main section article{background:lightgray;padding:10px;border-radius:10px;margin:10px;}
      main section .usuario{background:rgb(200,255,200);width:80%;border-radius:10px 0px 10px 10px;float:right;}
      main section .ia{background:rgb(255,255,200);width:80%;border-radius:0px 10px 10px 10px;float:left;}
    </style>
  </head>
  <body>
    <nav>
    </nav>
    <main>
      <section>
        
      </section>
      <input type="text">
    </main>
    <script>
      let entrada = document.querySelector("input")
      let mensajes = document.querySelector("main section")
      entrada.onkeyup = function(e){
      	if(e.key == "Enter"){
        	// Atrapo el valor del input
          let valor = this.value
          // Lo pongo en los mensajes
          mensajes.innerHTML += `
          	<article class="usuario">
            `+valor+`
            </article>
          `
          // Vacío el input
          this.value = ""
        }
      }
    </script>
  </body>
</html>
