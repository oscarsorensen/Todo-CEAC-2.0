<!doctype html>
<!--
  Interactúa con el usuario usando los cuadros de diálogo de `window`:
    1. Pide un texto con `prompt`.
    2. Si pulsa Cancelar (`prompt` devuelve `null`) o lo deja vacío, avísale con
       `alert` y muestra "Nothing typed" en `result`.
    3. Si no, pregúntale con `confirm` si quiere guardar el texto.
    4. Si acepta, muestra "Saved: <texto>"; si no, "Discarded: <texto>".

  Resultado esperado:
    Al cargar la página aparecen los diálogos y el párrafo muestra el resultado.


    Interact with the user using the `window` dialog boxes:
    1. Ask for text using `prompt`.
    2. If the user clicks Cancel (`prompt` returns `null`) or leaves the field blank, notify them with
       `alert` and display “Nothing typed” in `result`.
    3. Otherwise, use `confirm` to ask if they want to save the text.
    4. If they accept, display “Saved: <text>”; otherwise, “Discarded: <text>”.

  Expected result:
    When the page loads, the dialogs appear and the paragraph displays the result.



-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialogs</title>
</head>
<body>
  <p id="result"></p>

  <script>
    const result = document.querySelector("#result");
    const text = prompt("Write something");

    if (!text){
        alert("you typed nothing");
        result.textContent="nothing typed";
    } else{
        const save = confirm("Do you want to save?")
        if (save) {
            result.textContent = "Saved: " + text;
        } else {
            result.textContent = "Discarded: " + text;
        }
     }


  </script>
</body>
</html>
