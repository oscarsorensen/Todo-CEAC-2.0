<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Geolocalización</title>
</head>

<body>

    <h1>Geolocalización</h1>

    <button onclick="obtenerUbicacion()">
        Obtener mi ubicación
    </button>

    <p id="resultado"></p>

    <h1>Storage Name</h1>
    
    <input
        type="text"
        id="nombre"
        placeholder="Escribe tu nombre"
    >
    <input
    type="text"
    id="surnombre"
    placeholder="Escribe tu surnombre"
    >
    <input
    type="number"
    id="age"
    placeholder="Escribe tu age"
    >
    <input
    type="date"
    id="date"
    placeholder="Escribe tu date"
    >


    <button onclick="guardarNombre()">
        Guardar
    </button>

    <button onclick="mostrarNombre()">
        Recuperar
    </button>

    <button onclick="borrarNombre()">
        Borrar
    </button>

    <p id="resultado_nombre"></p>



    <h1>Comprueba si estás en Valencia</h1>

    <button onclick="estasEnValencia()">
        ¿Estoy en Valencia?
    </button>

    <p id="resultadoDondeEstas"></p>

    <h1>Manual URL check</h1>
    
    <input type="url" id="myurl" placeholder="random-url.com"> 
    <button onclick="myurl()">Try Url</button>


    <h1>My GitHub</h1>


    <button onclick="abrirVentana()">
        Abrir mi favorito web
    </button>

    <script>

        //original kode
        function obtenerUbicacion() {

            const resultado =
                document.getElementById("resultado");

            if (!navigator.geolocation) {

                resultado.textContent =
                    "El navegador no dispone de geolocalización.";

                return;

            }

            resultado.textContent =
                "Solicitando ubicación...";

            navigator.geolocation.getCurrentPosition(

                function (posicion) {

                    resultado.textContent =
                        "Latitud: " +
                        posicion.coords.latitude +
                        " | Longitud: " +
                        posicion.coords.longitude;

                },

                function () {

                    resultado.textContent =
                        "No se ha podido obtener la ubicación.";

                }

            );

        }


        /* ── valencia delen ── */

        function estasEnValencia() {

            const resultadoDondeEstas =
                document.getElementById("resultadoDondeEstas");


            navigator.geolocation.getCurrentPosition( //kalder denne geolocation igen, siden den jo ikke eksisterer længere, fra den tidligere funktion.

                function (posicion) {

                    if (
                        posicion.coords.latitude  >= 39.35 &&
                        posicion.coords.latitude  <= 39.55 &&
                        posicion.coords.longitude >= -0.45 &&
                        posicion.coords.longitude <= -0.25
                    ) {
                        resultadoDondeEstas.textContent =
                            "Estás en Valencia!";
                    } else {
                        resultadoDondeEstas.textContent =
                            "No estás en Valencia.";
                    }

                },

            );

        }


        function abrirVentana() {

        window.open(
            "https://github.com/oscarsorensen",
            "_blank"
        );

        }


        function myurl (){
            
            const url = document.getElementById("myurl").value;
            window.open(url, "_blank");

        }
  



            function guardarNombre() {

    const nombre =
        document.getElementById("nombre").value;

    localStorage.setItem("nombre", nombre);

    }


    function mostrarNombre() {

    const nombre =
        localStorage.getItem("nombre");

    document.getElementById("resultado_nombre").textContent =
        "Nombre almacenado: " + nombre;

    }


    function borrarNombre() {

    localStorage.removeItem("nombre");

    document.getElementById("resultado_nombre").textContent =
        "Información eliminada";

    }





    </script>

</body>

</html>
